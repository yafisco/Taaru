   name: Keep Supabase alive

   on:
     schedule:
       - cron: "0 8 */3 * *"
     workflow_dispatch:

   jobs:
     ping:
       runs-on: ubuntu-latest
       steps:
         - name: Ping Supabase (Taaru)
           run: |
             curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/commandes?select=id&limit=1" \
               -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
